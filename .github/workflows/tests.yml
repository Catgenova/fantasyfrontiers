name: tests

# Unit tests (headless Chrome) and the high-signal typecheck run on every push and PR. The local-only
# build has no backend, so there is no integration suite: everything the game does happens in the browser.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Puppeteer (+ bundled Chromium)
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        working-directory: tests
        run: node run-unit.mjs

  typecheck:
    name: Typecheck (checkJs, high-signal only)
    runs-on: ubuntu-latest
    # BLOCKING: the baseline is clean (0 high-signal), so this gate fails the build on any new
    # undefined identifier / renamed-key typo / use-before-def / redeclare / assign-to-const in the
    # inline game script. See scripts/typecheck.mjs for the curated code set + rationale.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install typescript
        run: npm install --no-audit --no-fund
      - name: Run high-signal typecheck
        run: npm run typecheck
